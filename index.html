
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Inspiration | Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">
        <header class="header">
            <div class="logo">✦</div>
            <h1>Daily Inspiration</h1>
            <p>A moment of clarity, every day.</p>
        </header>

        <section class="quote-card">
            <div class="quote-icon">“</div>

            <p class="quote-label">QUOTE OF THE MOMENT</p>

            <blockquote id="quote">
                The future depends on what you do today.
            </blockquote>

            <div class="line"></div>

            <p id="author" class="author">— Mahatma Gandhi</p>

            <button id="newQuote" type="button">
                <span>↻</span> New Quote
            </button>

            <p class="hint">A little inspiration goes a long way.</p>
        </section>

        <footer>
            <span class="footer-star">✦</span>
            <p>Made with care by <strong>Kushal Surana</strong></p>
            <span class="footer-caption">YOUR DAILY DOSE OF POSITIVITY</span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
